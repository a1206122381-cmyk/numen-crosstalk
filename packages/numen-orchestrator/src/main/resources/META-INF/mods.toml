modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# 纯客户端 mod：同伴的大脑在客户端，目标操作只能在客户端做。
clientSideOnly=true
displayTest="IGNORE_ALL_VERSION"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# ── Numen 是软依赖 ──
# mandatory=false：没装 Numen 时本 mod 照常加载，只是功能不启用。
# ordering=AFTER：保证 Numen 的核心初始化先跑完，我们再读 AgentLoopRegistry。
[[dependencies.${mod_id}]]
    modId="numen"
    mandatory=false
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="CLIENT"
